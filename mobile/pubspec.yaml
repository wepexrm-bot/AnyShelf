name: cloudread
description: CloudRead — cloud-native PDF reading app (Serene design)
publish_to: "none"
version: 4.0.1+2

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.0.2
  provider: ^6.1.2
  syncfusion_flutter_pdfviewer: ^34.1.33 # fixed-layout PDF rendering
  syncfusion_flutter_core: ^34.1.33 # theme API used to set the PDF background
  shared_preferences: ^2.3.2 # token + small local cache
  google_fonts: ^8.2.1
  file_selector: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata.ttf
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk.ttf
