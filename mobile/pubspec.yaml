name: cloudread
description: CloudRead — cloud-native PDF reading app (Serene design)
publish_to: "none"
version: 5.7.6+30

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.0.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2 # token + small local cache
  path_provider: ^2.1.4 # on-disk cache of PDFs + extracted text layers
  google_fonts: ^8.2.1
  file_selector: ^1.1.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  pdfrx: ^2.4.7 # PDFium page rendering (real page behind the text layer)
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata.ttf
    - family: HankenGrotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk.ttf
